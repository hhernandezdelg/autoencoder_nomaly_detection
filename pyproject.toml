[project]
name = "cv-assignments-2025"
version = "0.1.0"
description = "MLP + CNN"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "matplotlib",
  "tqdm",
  "pillow",
  "torch==2.3.1",
  "torchvision==0.18.1",
  "scikit-learn",
  "pandas",
  "ipython",  # only needed because your code imports IPython.display
]

[tool.uv]
index-strategy = "unsafe-first-match"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ipykernel>=7.1.0",
    "ruff>=0.14.8",
]
